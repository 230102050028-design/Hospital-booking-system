<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>نظام حجز مواعيد المستشفى | Hospital Appointment System</title>
                <link rel="stylesheet" href="style.css">
                    <!-- استدعاء أيقونات FontAwesome لمظهر عصري -->
                        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                        </head>
                        <body>

                            <header class="header">
                                    <div class="container">
                                                <h1><i class="fa-solid fa-hospital"></i> نظام حجز مواعيد المستشفى</h1>
                                                            <p>Hospital Appointment System</p>
                                                                    </div>
                                                                        </header>

                                                                            <main class="container main-content">
                                                                                    
                                                                                            <!-- قسم إضافة حجز جديد (Case 1) -->
                                                                                                    <section class="card form-section">
                                                                                                                <h2><i class="fa-solid fa-calendar-plus"></i> حجز موعد جديد</h2>
                                                                                                                            <form id="appointmentForm">
                                                                                                                                            <div class="form-group">
                                                                                                                                                                <label>اسم المريض:</label>
                                                                                                                                                                                    <input type="text" id="patientName" placeholder="أدخل اسم المريض" required>
                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                        <label>نوع المرض / التخصص:</label>
                                                                                                                                                                                                                                                            <input type="text" id="disease" placeholder="مثال: أسنان، باطنية، عيون..." required>
                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                            <div class="form-row">
                                                                                                                                                                                                                                                                                                                <div class="form-group">
                                                                                                                                                                                                                                                                                                                                        <label>رقم الهاتف:</label>
                                                                                                                                                                                                                                                                                                                                                                <input type="tel" id="phoneNumber" placeholder="770000000" required>
                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                <label>الجنس:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="gender" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="">اختر الجنس</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="ذكر">ذكر</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="أنثى">أنثى</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="form-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>تاريخ الموعد:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="date" id="appointmentDate" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>وقت الموعد:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="time" id="appointmentTime" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit" class="btn btn-primary">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <i class="fa-solid fa-check-circle"></i> تأكيد الحجز
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- قسم عرض المواعيد والإدارة (Case 2, 3, 4) -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section class="card display-section">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="section-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2><i class="fa-solid fa-list-check"></i> المواعيد المحجوزة</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="remindAllBtn" class="btn btn-secondary">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <i class="fa-solid fa-bell"></i> إرسال تذكير للكل
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="appointmentsList" class="appointments-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- سيتم إدراج بطاقات المواعيد هنا ديناميكياً بواسطة JS -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="script.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
